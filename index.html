<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Perfect Center Tamagotchi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --lcd-bg: #94a894; 
            --lcd-ink: #1a1d1a;
            --btn-bg: #444;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            color: var(--lcd-ink);
            overflow: hidden;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* Экран с фиксированным позиционированием содержимого */
        .screen {
            width: 320px;
            height: 320px;
            background-color: var(--lcd-bg);
            border: 8px solid var(--lcd-ink);
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .screen::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 3px 3px;
            pointer-events: none;
            z-index: 20;
        }

        /* Слой с показателями: жестко по углам */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .ui-row { display: flex; justify-content: space-between; width: 100%; }

        .stat-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .label { font-size: 6px; }
        .bar-outer {
            width: 35px; height: 6px;
            border: 1.5px solid var(--lcd-ink);
            background: rgba(0,0,0,0.05);
        }
        .bar-fill { height: 100%; background: var(--lcd-ink); transition: width 0.3s; }

        /* ЦЕНТРИРОВАНИЕ ПИТОМЦА */
        .pet-visual {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Идеальный центр */
            width: 90px;
            height: 90px;
            image-rendering: pixelated;
            z-index: 5;
            cursor: pointer;
        }

        /* Текст под питомцем */
        #message-bubble {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 8px;
            height: 20px;
            z-index: 10;
        }

        /* Кнопки */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 320px;
        }

        .btn {
            padding: 12px 5px;
            background: var(--btn-bg);
            color: #fff;
            border: 3px solid var(--lcd-ink);
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        .btn:disabled { opacity: 0.3; }

        .hidden { display: none !important; }

        /* Анимации */
        .anim-idle { animation: idle 1.5s infinite ease-in-out; }
        @keyframes idle { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -60%); } }
        
        .anim-shake { animation: shake 0.4s infinite; }
        @keyframes shake { 
            0%, 100% { transform: translate(-50%, -50%) rotate(0); } 
            25% { transform: translate(-50%, -50%) rotate(5deg); } 
            75% { transform: translate(-50%, -50%) rotate(-5deg); } 
        }

        .anim-jump { animation: jump 0.4s ease; }
        @keyframes jump { 
            0%, 100% { transform: translate(-50%, -50%); } 
            50% { transform: translate(-50%, -80%); } 
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="screen" id="mainScreen">
        
        <!-- Меню выбора -->
        <div id="selectionMenu" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%;">
            <p style="font-size: 10px; margin-bottom: 20px;">ВЫБЕРИ ПИТОМЦА</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn" onclick="startGame('owl')">СОВА</button>
                <button class="btn" onclick="startGame('lark')">ЖАВОРОНОК</button>
            </div>
        </div>

        <!-- Игровой мир -->
        <div id="gameUI" class="hidden">
            <div class="ui-layer">
                <div class="ui-row">
                    <div class="stat-group">
                        <span class="label">ГОЛОД</span>
                        <div class="bar-outer"><div id="bar-hunger" class="bar-fill"></div></div>
                    </div>
                    <div class="stat-group">
                        <span class="label">СКУКА</span>
                        <div class="bar-outer"><div id="bar-boredom" class="bar-fill"></div></div>
                    </div>
                </div>
                <div class="ui-row">
                    <div class="stat-group">
                        <span class="label">ГРЯЗЬ</span>
                        <div class="bar-outer"><div id="bar-dirt" class="bar-fill"></div></div>
                    </div>
                    <div class="stat-group">
                        <span class="label">ЗЛОБА</span>
                        <div class="bar-outer"><div id="bar-anger" class="bar-fill"></div></div>
                    </div>
                </div>
            </div>

            <img id="petSprite" class="pet-visual" src="" onclick="hatch()">
            <div id="message-bubble"></div>
        </div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls hidden" id="controlPanel">
        <button class="btn" onclick="doAction('feed')">ЕДА</button>
        <button class="btn" onclick="doAction('play')">ИГРА</button>
        <button class="btn" onclick="doAction('wash')">МЫТЬ</button>
        <button class="btn" onclick="doAction('pet')">ГЛАДИТЬ</button>
        <button class="btn" onclick="doAction('sleep')">СОН</button>
        <!-- Новая кнопка перезагрузки -->
    <button class="btn" style="background: #844;" onclick="location.reload()">ЗАНОВО</button>
    </div>
</div>

<script>
    const ASSETS = {
        egg: "img/egg.png",
        ghost: "img/ghost.png",
        owl: { idle: "img/owl_idle.png", action: "img/owl_action.png", dirty: "img/owl_dirty.png", angry: "img/owl_angry.png" },
        lark: { idle: "img/lark_idle.png", action: "img/lark_action.png", dirty: "img/lark_dirty.png", angry: "img/lark_angry.png" }
    };

    const PHRASES = {
        feed: ["М-М, ВКУСНО ;)", "НЯМ-НЯМ!", "ЕЩЕ КОФЕ?"],
        play: ["*РВАНЫЙ ВЫДОХ*", "*ТИХИЙ СТОН*"],
        wash: ["БУЛЬ-БУЛЬ!", "Я ЧИСТЫЙ!"],
        pet: ["МУР-Р-Р", "ПРИЯТНО", "СПАСИБО"],
        idle: ["ДОБРОЕ УТРО", "УТР.", "."],
        angry: ["Р-Р-Р!", "ЗЛЮСЬ!", "ОТСТАНЬ!"],
        dirty: ["ОТМОЙТЕ МЕНЯ ОТ ЭТОГО ДЕРЬМА", "В ДУШ И БЕЗ МЕНЯ?"]
    };

    let stats = { hunger: 0, boredom: 0, dirt: 0, anger: 0, isSleeping: false };
    let petType = null;
    let isAlive = true;
    let hatched = false;

    function startGame(type) {
        petType = type;
        document.getElementById('selectionMenu').classList.add('hidden');
        document.getElementById('gameUI').classList.remove('hidden');
        const sprite = document.getElementById('petSprite');
        sprite.src = ASSETS.egg;
        sprite.classList.add('anim-shake');
        say("КЛИКАЙ!");
    }

    function hatch() {
        if (hatched || !isAlive) return;
        hatched = true;
        const sprite = document.getElementById('petSprite');
        sprite.classList.remove('anim-shake');
        sprite.src = ASSETS[petType].idle;
        sprite.classList.add('anim-idle');
        document.getElementById('controlPanel').classList.remove('hidden');
        say("Я РОДИЛСЯ!");
        updateBars();
        setInterval(tick, 5000);
    }

    function tick() {
        if (!isAlive || stats.isSleeping) return;
        stats.hunger = Math.min(100, stats.hunger + 5);
        stats.boredom = Math.min(100, stats.boredom + 3);
        stats.dirt = Math.min(100, stats.dirt + 4);
        stats.anger = Math.min(100, stats.anger + 2);
        updateVisuals();
        updateBars();
        if (stats.hunger >= 100 || stats.anger >= 100) die();
    }

    function updateVisuals() {
        const sprite = document.getElementById('petSprite');
        if (!isAlive) return;
        if (stats.dirt > 60) sprite.src = ASSETS[petType].dirty;
        else if (stats.anger > 60) sprite.src = ASSETS[petType].angry;
        else sprite.src = ASSETS[petType].idle;
    }

    function updateBars() {
        document.getElementById('bar-hunger').style.width = stats.hunger + '%';
        document.getElementById('bar-boredom').style.width = stats.boredom + '%';
        document.getElementById('bar-dirt').style.width = stats.dirt + '%';
        document.getElementById('bar-anger').style.width = stats.anger + '%';
    }

    function doAction(action) {
        if (!isAlive || (stats.isSleeping && action !== 'sleep')) return;
        const sprite = document.getElementById('petSprite');
        
        sprite.classList.remove('anim-idle', 'anim-jump');
        void sprite.offsetWidth; // Reset animation

        if (action === 'feed') { stats.hunger = Math.max(0, stats.hunger - 30); stats.dirt += 5; sprite.classList.add('anim-jump'); }
        if (action === 'play') { stats.boredom = Math.max(0, stats.boredom - 40); stats.hunger += 10; sprite.classList.add('anim-jump'); }
        if (action === 'wash') { stats.dirt = 0; }
        if (action === 'pet') { stats.anger = Math.max(0, stats.anger - 40); }
        if (action === 'sleep') { 
            stats.isSleeping = !stats.isSleeping; 
            sprite.style.opacity = stats.isSleeping ? "0.4" : "1";
        }

        if (!stats.isSleeping) sprite.classList.add('anim-idle');
        
        say(PHRASES[action][Math.floor(Math.random() * PHRASES[action].length)]);
        updateVisuals();
        updateBars();
    }

    function say(text) {
        document.getElementById('message-bubble').innerText = text;
    }

    function die() {
        isAlive = false;
        const sprite = document.getElementById('petSprite');
        sprite.src = ASSETS.ghost;
        sprite.classList.remove('anim-idle');
        say("ПРОЩАЙ...");
        document.getElementById('controlPanel').classList.add('hidden');
    }
</script>
</body>
</html>
